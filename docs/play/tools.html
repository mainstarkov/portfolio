<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Интерактивное демо · Portfolio</title>
<link rel="stylesheet" href="weather.css">
<link rel="stylesheet" href="tools.css">
<script type="module" src="tools.js"></script>
</head>
<body>
<main>
<nav><a href="../">← Портфолио</a><a id="guide" hidden>Скачать и запустить ↗</a></nav>
<h1 id="title">Интерактивное демо</h1>
<p id="intro" class="intro"></p>
<div id="panel"></div>
<p id="status" role="status"></p>
</main>

<template id="go-room-booking">
<form>
  <div class="fields booking-fields">
    <label>Комната <select name="room"><option>Atlas</option><option>Orion</option><option>Vega</option></select></label>
    <label>Начало <input name="start" type="datetime-local" required></label>
    <label>Конец <input name="end" type="datetime-local" required></label>
  </div>
  <div class="actions"><button>Забронировать</button><button type="button" data-example disabled>Повторить последнюю бронь</button><button type="button" data-reset>Сбросить</button></div>
</form>
<p class="demo-note">Время указано по часам вашего устройства. Брони хранятся до перезагрузки страницы.</p>
<section class="result"><h2>Расписание</h2><ul id="bookings" class="rows"></ul></section>
</template>

<template id="go-choice-poll">
<form>
  <label for="voter">ID участника</label>
  <input id="voter" name="voter" value="demo-1" required maxlength="64">
  <div class="actions" aria-label="Язык для голосования" role="group"><button name="option" value="Go">Голос за Go</button><button name="option" value="Python">Голос за Python</button><button name="option" value="Rust">Голос за Rust</button></div>
  <div class="actions"><button type="button" data-example>Новый участник</button><button type="button" data-reset>Сбросить голоса</button></div>
</form>
<p class="demo-note">У каждого ID один голос. Результаты хранятся до перезагрузки страницы.</p>
<section class="result"><h2>Результаты</h2><p id="vote-total"></p><ul id="vote-results" class="rows"></ul></section>
</template>

<template id="go-event-inbox">
<form>
  <div class="fields">
    <label>ID события <input name="eventId" value="order-101" required maxlength="128"></label>
    <label>Тип события <input name="eventType" value="order.created" required maxlength="128"></label>
  </div>
  <div class="actions"><button>Отправить событие</button><button type="button" data-repeat disabled>Повторить последнее</button><button type="button" data-conflict disabled>Попробовать конфликт</button></div>
</form>
<p class="demo-note">Браузерное демо · имитация ответов API.</p>
<section class="result"><h2>История отправок</h2><p data-empty>Отправьте первое событие, чтобы увидеть ответ.</p><ul id="events" class="rows history"></ul></section>
</template>

<template id="go-job-queue">
<form>
  <label for="job-text">Текст задачи</label>
  <div class="search-row"><input id="job-text" name="jobText" value="hello" required maxlength="1000"><button>Отправить задачу</button></div>
</form>
<p class="demo-note">Браузерное демо · SHA-256 вычисляется на устройстве. Пауза помогает увидеть очередь.</p>
<section class="result"><h2>История задач</h2><p data-empty>Отправьте первую задачу, чтобы получить её результат.</p><ul id="jobs" class="rows history"></ul></section>
</template>

<template id="go-stock-counter">
<form>
  <div class="fields">
    <label>Артикул <input name="sku" value="coffee" required maxlength="40"></label>
    <label>Количество <input name="quantity" type="number" value="12" required min="1" max="1000000"></label>
  </div>
  <div class="actions"><button name="operation" value="1">Пополнить</button><button name="operation" value="-1">Списать</button><button type="button" data-reset>Сбросить</button></div>
</form>
<section class="result"><h2>Остатки</h2><ul id="stock" class="rows"></ul></section>
</template>

<template id="taskflow">
<form>
  <label for="task">Новая задача</label>
  <div class="search-row"><input id="task" name="task" placeholder="Например, проверить README" required maxlength="120"><button>Добавить</button></div>
</form>
<div class="actions"><button type="button" data-example>Загрузить пример</button><button type="button" data-reset>Очистить список</button></div>
<section class="result"><h2>Задачи</h2><p id="progress"></p><ul id="tasks" class="rows"></ul></section>
</template>

<template id="rs-palette-contrast">
<form>
  <div class="fields colors">
    <label>Цвет текста <input name="text" type="color" value="#202020"></label>
    <label>Цвет фона <input name="background" type="color" value="#ffffff"></label>
  </div>
  <div class="actions"><button type="button" data-example>Показать слабый контраст</button><button type="button" data-reset>Сбросить</button></div>
</form>
<section class="result"><h2>Предпросмотр</h2><div id="swatch"><strong>Заголовок</strong><div>Пример обычного текста</div></div><p>Коэффициент контраста <output id="ratio"></output></p></section>
</template>

<template id="node-query-card">
<form>
  <label for="query">URL или строка запроса</label>
  <div class="search-row"><input id="query" name="query" value="tag=go&amp;tag=rust&amp;q=hello+world" required maxlength="3000"><button>Разобрать</button></div>
</form>
<div class="actions"><button type="button" data-example>Пример с повторяющимся параметром</button></div>
<section class="result"><h2>Параметры</h2><dl id="params" class="rows"></dl></section>
</template>
</body>
</html>
