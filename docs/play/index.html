<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Попробовать проект · Portfolio</title><link rel="stylesheet" href="style.css"><script type="module" src="demo.js?v=dns-1"></script>
<style>
main{grid-template-columns:minmax(240px,1fr) minmax(300px,1.35fr);gap:36px}h1{font-size:clamp(2.6rem,6vw,4.8rem)}.console{border:1px solid #b4c6d3;border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 14px 42px #17365120}.console header,.console form{padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:end}.console header{justify-content:space-between;background:#e6eef5}.console textarea{width:100%;min-height:125px;padding:12px;border:1px solid #aabbc7;border-radius:8px;font:14px ui-monospace,monospace;resize:vertical}.console label{min-width:100%}.console pre{background:#172837;color:#d6f7e6;padding:18px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;min-height:130px;max-height:370px;overflow:auto}.scenarios{display:flex;flex-wrap:wrap;gap:7px;padding:0 14px 14px}.scenarios:empty{display:none}@media(max-width:720px){main{grid-template-columns:1fr}}
</style>
<main><section class="intro"><a href="../">← Portfolio</a><h1 id="title">Попробовать проект</h1><p id="intro"></p><p id="hint" class="note"></p><a id="guide" href="../">Скачать и запустить ↗</a></section>
<section class="console" aria-label="Интерактивный пример"><header><strong>Демо</strong><button id="reset" type="button">Сбросить</button></header><form id="input"><label>Входные данные<textarea spellcheck="false" maxlength="20000"></textarea></label><button>Выполнить</button></form><div class="scenarios"></div><pre id="result" aria-live="polite">Измените данные или нажмите «Выполнить».</pre></section></main></html>
